[package]
name = "simvader"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
url = "2"
ureq = { version = "2", optional = true, features = ["json", "tls"] }

[features]
default = []
llm = ["dep:ureq"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

